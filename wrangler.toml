name = "cuet-free-mock-test"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "cuet-mock-db"
database_id = "1248d1b3-e3d4-4815-99dc-1587a26d25f7"
migrations_dir = "prisma/migrations"
migrations_pattern = "prisma/migrations/*/migration.sql"

# Question-diagram bytes live in Workers KV; D1 stores only metadata and the
# object key. KV is included in the free Workers plan and needs no payment
# method. Bytes are served through /api/media/[id] with immutable cache headers.
# The app still honours an optional R2 `MEDIA` binding if one is added later.
[[kv_namespaces]]
binding = "MEDIA_KV"
id = "7dbf595cf5134e8d9b42fc2ab8e8b69d"

[vars]
NEXTAUTH_URL = "https://cuet-free-mock-test.cuet-platform.workers.dev"
NEXT_PUBLIC_APP_URL = "https://cuet-free-mock-test.cuet-platform.workers.dev"
NEXT_PUBLIC_ADSENSE_CLIENT_ID = ""
NEXT_PUBLIC_ADSENSE_SLOT_BANNER = ""
NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR = ""

# Secret (set via `wrangler secret put`):
# NEXTAUTH_SECRET
