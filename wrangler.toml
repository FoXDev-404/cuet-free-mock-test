name = "cuet-free-mock-test"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "cuet-mock-db"
database_id = "1248d1b3-e3d4-4815-99dc-1587a26d25f7"
migrations_dir = "prisma/migrations"
migrations_pattern = "prisma/migrations/*/migration.sql"

[vars]
NEXTAUTH_URL = "https://cuet-free-mock-test.cuet-platform.workers.dev"
NEXT_PUBLIC_APP_URL = "https://cuet-free-mock-test.cuet-platform.workers.dev"
NEXT_PUBLIC_ADSENSE_CLIENT_ID = ""
NEXT_PUBLIC_ADSENSE_SLOT_BANNER = ""
NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR = ""

# Secret (set via `wrangler secret put`):
# NEXTAUTH_SECRET
