name = "cuet-free-mock-test"
compatibility_date = "2024-12-01"
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "cuet-mock-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "prisma/migrations"

[vars]
NEXTAUTH_URL = "https://your-cf-domain.workers.dev"
NEXT_PUBLIC_APP_URL = "https://your-cf-domain.workers.dev"
NEXT_PUBLIC_ADSENSE_CLIENT_ID = ""
NEXT_PUBLIC_ADSENSE_SLOT_BANNER = ""
NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR = ""

# Secret (set via `wrangler secret put`):
# NEXTAUTH_SECRET
